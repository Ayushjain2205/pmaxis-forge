# Ride on dsh-web-app's host plane (webserver, /api, connection).
# Their web-runtime hardcodes DeepSeek dist; disable it and insert ours.
# Patch cannot change a row's plugin `name` (dsh skips name mismatches).

- id: web-runtime
  name: '@deepseek-ai/dsh-web-app'
  disabled: true

- insert:
    - id: forge-web-runtime
      name: dsh-forge-web
      inject: [webStartup, webServer]
      config:
        openBrowser: !!js ctx.webStartup.openBrowser
        printUrl: true
        trustedHosts: !!js ctx.webStartup.trustedHosts

- id: client-hmr
  disabled: true

- id: modules
  disabled: true

